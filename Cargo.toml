[workspace]
resolver = "2"
members = [
    "apps/desktop/src-tauri",
    "crates/xushu-core",
    "crates/xushu-hook",
    "crates/xushu-hook-protocol",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.90"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
