[package]
name = "xushu-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "xushu_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }
serde.workspace = true
tauri = { version = "=2.12.5", features = [] }
uuid = "=1.29.0"
xushu-core = { path = "../../../crates/xushu-core" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSScreen", "NSWindow"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSString", "NSUserDefaults"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
serde_json = "=1.0.154"
tauri = { version = "=2.12.5", features = ["test"] }
tempfile = "=3.27.0"
